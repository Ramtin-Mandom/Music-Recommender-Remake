[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-recommender-remake"
version = "3.1.0"
description = "A content-based k-NN music recommendation engine with a Streamlit test bench."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ramtin Rezaei" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
desktop = ["PyQt6>=6.5"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
music-rec = "music_recommender.cli:main"

[project.gui-scripts]
music-rec-gui = "music_recommender.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the full v2 dataset (data/raw/tracks.csv) (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
