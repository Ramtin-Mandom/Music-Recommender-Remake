[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-recommender-remake"
version = "2.0.0"
description = "A content-based k-NN music recommendation engine with a Streamlit test bench."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ramtin Rezaei" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
music-rec = "music_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the full 170k-track dataset (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
